# Render Blueprint: one API web service, one Postgres database and two static
# sites from this monorepo. New → Blueprint in the Render dashboard, pick this
# repo, then fill in the values marked sync: false when prompted.
#
# The URLs only exist after the first deploy, so the order is:
#   1. Deploy the Blueprint (fill VITE_API_URL with https://<api>.onrender.com/api
#      using the API name you see in the form; CLIENT_ORIGINS can wait).
#   2. Set CLIENT_ORIGINS on the API to the two static-site URLs and redeploy it.
databases:
  - name: odin-blog-db
    plan: free
    region: oregon
    databaseName: blog_api

services:
  - type: web
    name: odin-blog-api
    runtime: node
    rootDir: api
    plan: free
    region: oregon
    healthCheckPath: /
    # --include=dev: the build needs the Prisma CLI, which is a devDependency.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: odin-blog-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: AUTHOR_USERNAME
        value: author
      # The author's login password. Prompted for, never committed.
      - key: AUTHOR_PASSWORD
        sync: false
      - key: SEED_SAMPLE_POST
        value: "true"
      # e.g. https://odin-blog-client.onrender.com,https://odin-blog-admin.onrender.com
      - key: CLIENT_ORIGINS
        sync: false

  - type: web
    name: odin-blog-client
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # Client-side routing: serve index.html for every path.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false

  - type: web
    name: odin-blog-admin
    runtime: static
    rootDir: admin
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_CLIENT_URL
        sync: false
