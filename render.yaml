# Render Blueprint: the Postgres database and the two static sites. New →
# Blueprint in the Render dashboard, pick this repo, then fill in the values
# marked sync: false when prompted.
#
# The API is deliberately not in this file. It runs as a standalone Render Web
# Service (odin-blog-api) created in the dashboard, so a Blueprint sync never
# creates a second copy of it. Its settings, for recreating it:
#   Root directory: api
#   Build command:  npm ci --include=dev && npm run build
#   Start command:  npm start
#   Env vars:       NODE_ENV=production, DATABASE_URL (odin-blog-db's internal
#                   URL), JWT_SECRET (generated), AUTHOR_USERNAME, AUTHOR_PASSWORD,
#                   SEED_SAMPLE_POST=true, CLIENT_ORIGINS (both static-site URLs)
databases:
  - name: odin-blog-db
    plan: free
    region: oregon
    databaseName: blog_api

services:
  # VITE_API_URL: https://odin-blog-api-olv3.onrender.com/api
  - type: web
    name: odin-blog-client
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # Client-side routing: serve index.html for every path.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false

  - type: web
    name: odin-blog-admin
    runtime: static
    rootDir: admin
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_CLIENT_URL
        sync: false
